server {
    listen 8080 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # Hide server version information
    server_tokens off;

    # Timeouts & Keepalive for high concurrency
    keepalive_timeout 65;
    keepalive_requests 1000;
    client_body_timeout 600s;
    client_header_timeout 60s;
    send_timeout 600s;

    # Max body size (matches PHP post_max_size 500M)
    client_max_body_size 500M;
    client_body_buffer_size 128k;

    # Gzip Compression (drastically reduces JSON payload transfer time)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/xml
        application/xhtml+xml
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon
        text/css
        text/plain
        text/xml;

    # Ignore logs for common static meta files
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Laravel front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM handler with tuned buffers to avoid disk I/O spilling
    location ~ \.php$ {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass 127.0.0.1:9000;

        # FastCGI buffer tuning: keeps responses in memory without buffering to disk
        fastcgi_buffering on;
        fastcgi_buffer_size 64k;
        fastcgi_buffers 32 32k;
        fastcgi_busy_buffers_size 128k;
        fastcgi_temp_file_write_size 256k;

        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 600s;
        fastcgi_read_timeout 600s;
    }

    # Static assets cache (disable disk access logging for static assets)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
        log_not_found off;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Logging
    access_log /var/log/nginx/access.log combined buffer=64k flush=5s;
    error_log  /var/log/nginx/error.log warn;
}
